name: disclosure-gap

services:
  web:
    image: node:22.14.0-alpine
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "echo 'WEB-01 is not implemented; container is ready for development.' && tail -f /dev/null",
      ]
    env_file: ../.env.example
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace
    depends_on:
      api:
        condition: service_started

  api:
    image: python:3.12.3-slim
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "echo 'API-01 is not implemented; container is ready for development.' && tail -f /dev/null",
      ]
    env_file: ../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ..:/workspace
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: disclosure_gap
      POSTGRES_USER: disclosure_gap
      POSTGRES_PASSWORD: local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disclosure_gap -d disclosure_gap"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
