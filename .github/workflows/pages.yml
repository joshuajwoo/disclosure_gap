name: Deploy synthetic demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v6
        with:
          static_site_generator: next
      - run: npm ci
      - name: Build synthetic-only static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build --workspace apps/web
      - name: Scan deployable artifact
        run: python scripts/verify_public_artifact.py apps/web/out
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
