name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: npm ci
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm run lint
      - run: npm run typecheck
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy apps/api/disclosure_gap_api research
      - run: pytest
      - name: Build and scan the synthetic public artifact
        run: make release-check PYTHON=python
      - name: Rebuild the synthetic validation report
        run: make report PYTHON=python
      - name: Apply migrations to an empty database
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:////tmp/disclosure-gap-ci.sqlite
        run: alembic upgrade head
      - name: Verify Compose configuration
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run critical participant-flow tests
        run: npm run e2e
