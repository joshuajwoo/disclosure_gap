[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-gap"
version = "0.1.0"
requires-python = "==3.12.3"
dependencies = [
  "alembic==1.15.1",
  "duckdb==1.2.1",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "matplotlib==3.10.1",
  "numpy==2.2.4",
  "pandas==2.2.3",
  "polars==1.25.2",
  "psycopg[binary]==3.2.6",
  "pydantic-settings==2.8.1",
  "scikit-learn==1.6.1",
  "sqlalchemy==2.0.39",
  "starlette==1.3.1",
  "statsmodels==0.14.4",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema==4.25.1",
  "mypy==1.15.0",
  "pandas-stubs==2.2.3.250308",
  "pytest==9.1.1",
  "pytest-cov==6.0.0",
  "ruff==0.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests", "research/tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [".venv"]
